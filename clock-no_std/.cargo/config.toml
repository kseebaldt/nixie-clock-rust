[target.xtensa-esp32-none-elf]
runner = "espflash flash --monitor --chip esp32"

[env]
ESP_LOG = "info"
# Required for AP+STA mode: the default event channel is too small for both
# AP-side and STA-side WiFi events to coexist, which silently drops events.
ESP_RADIO_CONFIG_EVENT_CHANNEL_CAPACITY = "4"

[build]
rustflags = [
  "-C", "link-arg=-nostartfiles",
]

target = "xtensa-esp32-none-elf"

[unstable]
build-std = ["alloc", "core"]
