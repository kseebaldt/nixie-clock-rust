[package]
edition = "2021"
name = "clock-no_std"
version = "0.1.0"

[[bin]]
name = "clock-no_std"
path = "./src/bin/main.rs"


[dependencies]
esp-bootloader-esp-idf = "0.1.0"
esp-hal = { version = "=0.23.1", features = ["esp32", "unstable"] }

# Hardware drivers
drivers = { path = "../drivers", default-features = false }
embedded-hal = "1.0"
embedded-hal-async = "1.0"

# Embassy synchronization
embassy-sync = "0.6"

# Logging
log = "0.4"
esp-println = { version = "0.11", features = ["esp32", "log"] }
esp-backtrace = { version = "0.14", features = [
  "esp32",
  "exception-handler",
  "panic-handler",
  "println",
] }

# Time support (for Phase 2)
chrono = { version = "0.4", default-features = false }
# chrono-tz = { version = "0.8", default-features = false }  # TODO: Add back in Phase 5

embassy-net = { version = "0.7.0", features = [
  "dhcpv4",
  "medium-ethernet",
  "tcp",
  "udp",
] }
embedded-io = "0.6.1"
embedded-io-async = "0.6.1"
esp-alloc = "0.6.0"
# for more networking protocol support see https://crates.io/crates/edge-net
critical-section = "1.2.0"
embassy-executor = { version = "0.7.0", features = ["task-arena-size-20480"] }
embassy-time = { version = "0.4.0", features = ["generic-queue-64"] }
embassy-futures = "0.1.0"
esp-hal-embassy = { version = "0.6.0", features = ["esp32"] }
esp-wifi = { version = "0.12.0", features = [
  "esp-alloc",
  "esp32",
  "smoltcp",
  "wifi",
] }
smoltcp = { version = "0.12.0", default-features = false, features = [
  "medium-ethernet",
  "multicast",
  "proto-dhcpv4",
  "proto-dns",
  "proto-ipv4",
  "socket-dns",
  "socket-icmp",
  "socket-raw",
  "socket-tcp",
  "socket-udp",
] }
static_cell = { version = "2.1.0", features = ["nightly"] }
heapless = "0.8"


[profile.dev]
# Rust debug is too slow.
# For debug builds always builds with some optimization
opt-level = "s"

[profile.release]
codegen-units = 1        # LLVM can perform better optimizations using a single thread
debug = 2
debug-assertions = false
incremental = false
lto = 'fat'
opt-level = 's'
overflow-checks = false
