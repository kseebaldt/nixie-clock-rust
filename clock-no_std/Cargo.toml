[package]
edition      = "2024"
name         = "clock-no_std"
rust-version = "1.88"
version      = "0.1.0"

[[bin]]
name = "clock-no_std"
path = "./src/bin/main.rs"

[dependencies]
# ESP-HAL ecosystem (crates.io versions)
esp-hal = { version = "1.0.0", features = ["esp32", "unstable"] }
esp-alloc = { version = "0.9.0" }
esp-backtrace = { version = "0.18.1", features = ["esp32", "panic-handler", "println"] }
esp-bootloader-esp-idf = { version = "0.4.0", features = ["esp32"] }
esp-println = { version = "0.16.1", features = ["esp32", "log-04"] }
esp-rtos = { version = "0.2.0", features = ["esp32", "embassy", "esp-radio"] }
esp-radio = { version = "0.17.0", features = ["esp32", "wifi"] }
esp-storage = { version = "0.8.1", features = ["esp32", "bytewise-read"] }
embedded-storage = "0.3"
embedded-storage-async = "0.4"
sequential-storage = "7.0"
embassy-embedded-hal = "0.5"

# Embassy
embassy-executor = "0.9.0"
embassy-futures = "0.1"
embassy-net = { version = "0.7.0", features = [
  "dhcpv4",
  "dns",
  "medium-ethernet",
  "tcp",
  "udp",
] }
embassy-time = "0.5.0"
embassy-sync = "0.6"

# DHCP server for AP mode
edge-dhcp = "0.5.0"
edge-nal = "0.5.0"
edge-nal-embassy = "0.6.0"

# Embedded
embedded-hal = "1.0.0"
embedded-io-async = "0.6.1"

# Other dependencies
defmt = "1.0.1"
static_cell = "2.1.0"
critical-section = "1.2.0"

# Local crates
drivers = { path = "../drivers", default-features = false }

# Time
chrono = { version = "0.4", default-features = false }
sntpc = { version = "0.7.0", default-features = false, features = ["embassy-socket-ipv6"] }

# Serialization
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
serde-json-core = "0.6"
postcard = "1.0"
heapless = "0.8"

# HTTP server
picoserve = { version = "0.17", default-features = false, features = ["embassy", "json"] }

[profile.dev]
opt-level = "s"

# esp-storage requires opt-level 2 or 3 on ESP32 for flash operations to work
[profile.dev.package.esp-storage]
opt-level = 3

[profile.release]
codegen-units    = 1
debug            = 2
debug-assertions = false
incremental      = false
lto              = 'fat'
opt-level        = 's'
overflow-checks  = false
