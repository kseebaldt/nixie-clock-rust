[package]
edition      = "2024"
name         = "clock-no_std"
rust-version = "1.88"
version      = "0.1.0"

[[bin]]
name = "clock-no_std"
path = "./src/bin/main.rs"

[features]
default = []
wifi = ["esp-rtos/esp-radio", "dep:esp-radio", "dep:embassy-net"]

[dependencies]
# ESP-HAL ecosystem (crates.io versions)
esp-hal = { version = "1.0.0", features = ["esp32", "unstable"] }
esp-alloc = { version = "0.9.0" }
esp-backtrace = { version = "0.18.1", features = ["esp32", "panic-handler", "println"] }
esp-bootloader-esp-idf = { version = "0.4.0", features = ["esp32"] }
esp-println = { version = "0.16.1", features = ["esp32", "log-04"] }
esp-rtos = { version = "0.2.0", features = ["esp32", "embassy"] }
esp-radio = { version = "0.17.0", features = ["esp32", "wifi"], optional = true }

# Embassy
embassy-executor = "0.9.0"
embassy-net = { version = "0.7.0", features = [
  "dhcpv4",
  "medium-ethernet",
  "tcp",
  "udp",
], optional = true }
embassy-time = "0.5.0"
embassy-sync = "0.6"

# Embedded
embedded-hal = "1.0.0"
embedded-io-async = "0.6.1"

# Other dependencies
defmt = "1.0.1"
static_cell = "2.1.0"
critical-section = "1.2.0"

# Local crates
drivers = { path = "../drivers", default-features = false }

# Time
chrono = { version = "0.4", default-features = false }

# Serialization
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }

[profile.dev]
opt-level = "s"

[profile.release]
codegen-units    = 1
debug            = 2
debug-assertions = false
incremental      = false
lto              = 'fat'
opt-level        = 's'
overflow-checks  = false
