[package]
name = "drivers"
version = "0.1.0"
edition = "2021"

[dependencies]
embedded-hal = "1.0.0"
serde = { version = "1.0", default-features = false, features = ["derive"] }
shift-register-driver = "0.1.1"
chrono = { version = "0.4", default-features = false }
postcard = { version = "1.1", default-features = false }
thiserror = { version = "2.0", default-features = false }
toml-cfg = { version = "=0.2.0", optional = true }
validator = { version = "0.20", features = ["derive"], optional = true }

[features]
default = ["std"]
std = ["serde/std", "chrono/std", "postcard/use-std", "thiserror/std", "toml-cfg", "validator"]

[dev-dependencies]
testing        = { path = "../testing" }